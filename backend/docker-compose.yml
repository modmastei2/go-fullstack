services:
  backend:
    image: backend:${BACKEND_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    # จำกัดการใช้ memory สูงสุดไม่เกิน 256MB เพื่อลดการใช้ทรัพยากร
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped