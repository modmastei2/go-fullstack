basePath: /api/v1
definitions:
  auth.LockSessionRequest:
    properties:
      timestamp:
        type: integer
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.TokenResponse:
    properties:
      message:
        type: string
      user: {}
    type: object
  auth.UnlockRequest:
    properties:
      password:
        type: string
    type: object
  shared.ErrorResponse:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API documentation for the KS_Wealth backend server. Authentication
    uses HTTP-only cookies.
  title: KS_Wealth API
  version: "1.0"
paths:
  /auth/check-session:
    get:
      consumes:
      - application/json
      description: Get current user session information and lock status
      produces:
      - application/json
      responses:
        "200":
          description: Session information including lock status and user data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Check session status
      tags:
      - Auth
  /auth/lock:
    post:
      consumes:
      - application/json
      description: Lock current session temporarily (similar to screen lock)
      parameters:
      - description: Lock timestamp
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LockSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Session locked successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Lock user session
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with username and password. Sets access_token
        and refresh_token cookies automatically.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in with tokens set in HTTP-only cookies
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate current session and clear cookies
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out, cookies cleared
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - CookieAuth: []
      summary: User logout
      tags:
      - Auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Retrieve authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: User profile with session data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get user profile
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Generate new access token using refresh token from cookie (automatic)
      produces:
      - application/json
      responses:
        "200":
          description: New access token generated
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/unlock:
    post:
      consumes:
      - application/json
      description: Unlock previously locked session by verifying password
      parameters:
      - description: Password for verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UnlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Session unlocked successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "401":
          description: Invalid password
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Session is not locked
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Unlock user session
      tags:
      - Auth
securityDefinitions:
  CookieAuth:
    description: Access token stored in HTTP-only cookie. Login via /auth/login to
      set cookie automatically.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
