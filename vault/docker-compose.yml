services:
  vault:
    image: hashicorp/vault:1.21
    container_name: vault
    ports:
      - "8200:8200"
    # volumes:
    #   - ./config:/vault/config
    #   - ./data:/vault/data
    # environment:
    #   VAULT_ADDR: http://0.0.0.0:8200
    # cap_add:
    #   - IPC_LOCK
    # command: vault server -config=/vault/config/vault.hcl

    # Development mode
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "EXAMPLE_DEV_VAULT_ROOT_TOKEN"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    # จำกัดการใช้ memory สูงสุดไม่เกิน 128MB เพื่อลดการใช้ทรัพยากร
    mem_limit: 128M
    mem_reservation: 64M
    restart: unless-stopped

  # ใช้ curl ยิงไป init ค่าเริ่มต้นใน Vault
  vault-init:
    image: curlimages/curl:8.5.0
    depends_on:
      - vault
    command: |
      sh -c '
        sleep 5
        curl -X POST \
          -H "X-Vault-Token: EXAMPLE_DEV_VAULT_ROOT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"data\":{\"jwt_secret\":\"EXAMPLE_DEV_JWT_SECRET\",\"db_password\":\"EXAMPLE_DEV_DB_PASSWORD\",\"redis_password\":\"EXAMPLE_DEV_REDIS_PASSWORD\", \"minio_root_user\":\"EXAMPLE_DEV_MINIO_ROOT_USER\", \"minio_root_password\":\"EXAMPLE_DEV_MINIO_ROOT_PASSWORD\"}}" \
          http://vault:8200/v1/secret/data/fiber-app
      '
    # จำกัดการใช้ memory สำหรับ init container
    mem_limit: 32M