name: build-and-test

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'

env:
  BACKEND_IMAGE: modmastei2/go-backend
  FRONTEND_IMAGE: modmastei2/react-frontend
  
jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- SECRET SCAN
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        with: 
          config_path: .gitleaks.toml
  
  code-check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- VALIDATE TAG FORMAT
      - name: Validate Tag Format
        if: github.ref_type == 'tag'
        run: echo $GITHUB_REF_NAME | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || (echo "Tag format is invalid. Use vMAJOR.MINOR.PATCH" && exit 1)

      # --- BACKEND TEST
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
      
      - name: Go Build
        run: cd backend && go build -o main ./cmd/api

      - name: Go Vet
        run: cd backend && go vet ./cmd/api
      
      - name: Go Test with Coverage
        run: | 
          cd backend 
          go test -v ./... -coverprofile=coverage.out -covermode=atomic

      # --- DOCKER FILE LINT
      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      # --- SONARQUBE SCAN backend
      - name: Sonar Scan Backend
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=go-fullstack-backend
            -Dsonar.sources=backend
            -Dsonar.go.coverage.reportPaths=backend/coverage.out
          # -Dsonar.organization=modmastei2

      # --- FRONTEND TEST
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend Install Dependencies
        run: cd frontend && npm install

      #- name: Frontend Test
      #  run: cd frontend && npm test -- --watchAll=false

      - name: Frontend Build
        run: cd frontend && npm ci && npm run build

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile 

      # --- SONARQUBE SCAN frontend
      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=go-fullstack-frontend
            -Dsonar.sources=frontend

  build-image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- DOCKER HUB LOGIN
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      
      # --- BUILD AND PUSH BACKEND IMAGE
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest

      # --- BUILD AND PUSH FRONTEND IMAGE
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_ENV=ci
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # --- CONTAINER SCAN BACKEND
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      # --- CONTAINER SCAN FRONTEND
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  sync-prod-repo:
    if: github.ref_type == 'tag'
    needs: [secret-scan, code-check, build-image]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- PUSH CODE TO PRODUCTION REPO
      - name: Push Code to Production Repository
        run: |
          git remote add bitbucket https://x-token-auth:${{ secrets.BITBUCKET_API_TOKEN }}@${{ secrets.BITBUCKET_REPO }}
          git push bitbucket HEAD:master --force
          git push bitbucket --tags --force 
          
          
      #git push bitbucket HEAD:master --force
      #git push bitbucket --tags --force


      
