name: build-and-test

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'

env:
  BACKEND_IMAGE: xxxx/go-backend
  FRONTEND_IMAGE: xxxx/react-frontend
  
jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- SECRET SCAN
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        with: 
          config_path: .gitleaks.toml
  
  security-check:
    #if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- VALIDATE TAG FORMAT
      - name: Validate Tag Format
        if: github.ref_type == 'tag'
        run: echo $GITHUB_REF_NAME | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || (echo "Tag format is invalid. Use vMAJOR.MINOR.PATCH" && exit 1)

      # --- BACKEND TEST
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
      
      # --- TRY BUILD GO
      - name: Go Build
        run: cd backend && go build -o main ./cmd/api

      # --- VET GO
      - name: Go Vet
        run: cd backend && go vet ./cmd/api
