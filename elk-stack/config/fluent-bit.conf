[SERVICE]
    Flush        1
    Log_Level   info
    Parsers_File parsers.conf

[INPUT]
    Name   tail
    Path   /var/lib/docker/containers/*/*-json.log
    Parser docker
    Tag    docker

[FILTER]
    Name        parser
    Match       docker
    Key_Name    log
    Parser      json
    Reserve_Data On

[OUTPUT]
    Name  stdout
    Match *

