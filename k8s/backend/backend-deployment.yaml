apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: go-fullstack
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      # รอให้ dependencies พร้อมก่อน
      - name: wait-for-vault
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          until curl -sf http://vault:8200/v1/sys/health?standbyok=true > /dev/null; do
            echo "Waiting for Vault..."
            sleep 3
          done
          echo "Vault is ready!"
        resources:
          limits:
            memory: "32Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "50m"
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          until redis-cli -h redis -p 6379 ping > /dev/null 2>&1; do
            echo "Waiting for Redis..."
            sleep 3
          done
          echo "Redis is ready!"
        resources:
          limits:
            memory: "32Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "50m"
      containers:
      - name: backend
        image: backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: vault-token
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
