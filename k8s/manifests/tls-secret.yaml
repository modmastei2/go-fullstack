apiVersion: v1
kind: Secret
metadata:
  name: go-fullstack-tls
  namespace: go-fullstack
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # To create this secret from cert files, run:
  # kubectl create secret tls go-fullstack-tls \
  #   --cert=../certs/dev.cert.pem \
  #   --key=../certs/dev.cert.key \
  #   -n go-fullstack --dry-run=client -o yaml > tls-secret.yaml
  #
  # Or apply directly:
  # kubectl create secret tls go-fullstack-tls \
  #   --cert=../certs/dev.cert.pem \
  #   --key=../certs/dev.cert.key \
  #   -n go-fullstack
  tls.crt: ""
  tls.key: ""
